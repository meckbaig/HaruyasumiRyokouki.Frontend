<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- seo:start -->
    <title>Spring Break — Three months across Japan</title>
    <meta
      name="description"
      content="A timeline of a three-month trip across Japan — notes, photos, video and a map, day by day."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spring Break" />
    <meta property="og:title" content="Spring Break — Three months across Japan" />
    <meta
      property="og:description"
      content="A timeline of a three-month trip across Japan — notes, photos, video and a map, day by day."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <!-- seo:end -->

    <!-- The drawing itself where a browser will take it, and a raster behind it
         for those that will not. Order matters: a browser picks the last icon it
         understands, so the fallback is declared as `alternate`. -->
    <link rel="icon" href="/haru-logo.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/icon-192.png" type="image/png" />
    <!-- Safari takes no SVG here. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#faf8f5" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
